# release na mão: Actions → release → Run workflow, com a versão (ex.: 3.2.0).
# cria a tag na main e as notas com os PRs desde a última release, como as de antes.
name: release
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'versão (ex.: 3.2.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: cria a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versão tem que ser X.Y.Z"; exit 1; }
          gh release create "$VERSAO" --repo "$GITHUB_REPOSITORY" --target main --title "$VERSAO" --generate-notes
