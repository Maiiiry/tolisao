name: Testes
on:
  pull_request:
    branches: [main]
  # também roda direto na main: é o único jeito do cache do playwright sobreviver, já
  # que ele fica preso à branch que o salvou e toda PR aqui apaga a própria branch no
  # merge — sem isso, nenhuma PR nova herda cache de nenhuma outra, só sempre da main
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # só olha ferramenta (o site não tem dependência): avisa, mas não trava o deploy
      - run: npm audit --audit-level=high || echo "::warning::npm audit achou falha grave numa ferramenta de teste"
      - run: npx prettier --check app.js qr.js mesa/mesa.js
      - run: npm run types
      - run: npm run regras
      # a API (servidor/) se testa com o node puro: o npm ci de lá só traz o wrangler, que é pra subir
      - run: npm test
        working-directory: servidor
      - run: echo "PW_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          if ldd ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | grep 'not found'; then
            npx playwright install-deps chromium
          fi
      - run: npm test
